name: Final v2.1 polish

on:
  push:
    branches:
      - website-v2.1-final-polish

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[final-polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: website-v2.1-final-polish
          fetch-depth: 0

      - name: Apply final polish
        run: python tools/final_polish.py

      - name: Commit final polish
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No final-polish changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make legal footer crawlable and centralize shared behavior [final-polish-applied]"
          git push origin HEAD:website-v2.1-final-polish
