name: Website QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - website-v2.1-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate static site
        run: python tools/validate_site.py
