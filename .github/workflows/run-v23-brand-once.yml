name: One-time v2.3 brand migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event.head_commit.message == 'Temporarily run guarded v2.3 brand migration' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out brand branch
        uses: actions/checkout@v4
        with:
          ref: website-v2.3-brand-compliance
          fetch-depth: 0

      - name: Apply guarded brand migration
        run: python tools/apply_v23_brand_release.py

      - name: Remove one-time migration script
        run: rm tools/apply_v23_brand_release.py

      - name: Commit brand branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align website with controlled Cutline brand standards"
          git push origin HEAD:website-v2.3-brand-compliance
