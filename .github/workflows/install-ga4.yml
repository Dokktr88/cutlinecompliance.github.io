name: Install GA4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-ga4:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Google Analytics tag to every HTML page
        shell: python
        run: |
          from pathlib import Path

          measurement_id = "G-Z4KHLSPY1T"
          tag = '''  <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4KHLSPY1T"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-Z4KHLSPY1T');
          </script>
          '''

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if measurement_id in text:
                  continue
              if '<head>' not in text:
                  raise SystemExit(f"Missing <head> in {path}")
              text = text.replace('<head>\n', '<head>\n' + tag, 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit analytics installation
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Install GA4 tracking across public site"
          git push
