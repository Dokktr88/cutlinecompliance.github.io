name: Apply v2.2 content architecture

on:
  push:
    branches:
      - website-v2.2-architecture-correction

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v22-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: website-v2.2-architecture-correction
          fetch-depth: 0

      - name: Apply guarded architecture correction
        run: python tools/apply_v22_content_architecture.py

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct product hierarchy, paper promotion, and acronym use [v22-applied]"
          git push origin HEAD:website-v2.2-architecture-correction
