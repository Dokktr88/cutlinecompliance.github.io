name: Apply website v2.1 hardening

on:
  push:
    branches:
      - website-v2.1-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v21-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: website-v2.1-hardening
          fetch-depth: 0

      - name: Apply deterministic HTML transforms
        run: python tools/apply_v21.py

      - name: Commit transformed pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'intelligence/**/*.html' || true
          git add -A
          git commit -m "Apply website v2.1 page hardening [v21-applied]"
          git push origin HEAD:website-v2.1-hardening
