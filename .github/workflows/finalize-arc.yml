name: Finalize ARC positioning

on:
  push:
    branches:
      - website-v2.1-arc-positioning

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[arc-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: website-v2.1-arc-positioning
          fetch-depth: 0

      - name: Finalize ARC architecture
        run: python tools/finalize_arc.py

      - name: Commit final ARC lock
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No ARC finalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/validate_site.py
          git commit -m "Finalize ARC public architecture and release lock [arc-finalized]"
          git push origin HEAD:website-v2.1-arc-positioning
