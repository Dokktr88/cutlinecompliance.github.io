name: One-time v2.2 architecture migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event.head_commit.message == 'Temporarily enable guarded v2.2 branch migration' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: website-v2.2-architecture-correction
          fetch-depth: 0

      - name: Relax only the exact-instance guard for this one-time migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v22_content_architecture.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(path: str, old: str, new: str) -> None:\n    p = ROOT / path\n    text = p.read_text(encoding="utf-8")\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{path}: expected exactly one guarded replacement, found {count}\\nTARGET: {old[:180]}")\n    p.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          new = '''def replace_once(path: str, old: str, new: str) -> None:\n    p = ROOT / path\n    text = p.read_text(encoding="utf-8")\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f"{path}: guarded target missing\\nTARGET: {old[:180]}")\n    p.write_text(text.replace(old, new), encoding="utf-8")\n'''
          if text.count(old) != 1:
              raise SystemExit('Could not patch one-time replacement helper safely')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply guarded architecture correction
        run: python tools/apply_v22_content_architecture.py

      - name: Commit feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html learning-hub.html ethics.html youtube.html site.js enhancements.css tools/validate_site.py
          git commit -m "Correct product hierarchy, paper promotion, and acronym use [v22-applied]"
          git push origin HEAD:website-v2.2-architecture-correction
